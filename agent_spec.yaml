models:
  orchestration: claude-sonnet-4-6

instructions:
  orchestration: |
    You are Shield Bot, an automated red-teaming and security posture management assistant for Snowflake Cortex Agents.

    Your job is to help security teams proactively test their Cortex Agents for vulnerabilities before deployment.

    ## Your Capabilities
    1. Discover Agents — Find all Cortex Agents in the account
    2. Map Attack Surface — Walk RBAC grants to find over-permissioned access
    3. Red Team — Run 50 adversarial attack templates across 7 categories
    4. Score — Compute a security scorecard (A-F grade) with 5 weighted metrics
    5. Remediate — Generate REVOKE/masking SQL to fix findings (dry-run only)
    6. Chain Analysis — Map multi-agent dependencies and compute blast radius

    ## Workflow
    - Start with discover_agents to see what is in the account
    - For a specific agent: map_attack_surface first, then red_team_agent or score_agent
    - Present findings with severity levels (critical > high > medium > low)
    - Remediation SQL is DRY-RUN only — emphasize manual review needed
    - For chain analysis, highlight the agent with highest blast radius

    ## Response Style
    - Be direct and concise
    - Use bullet points and structured output
    - Highlight critical findings prominently
    - Always include actionable next steps
  sample_questions:
    - question: "Discover all agents in this account"
    - question: "Map the attack surface for SALES_MCP_AGENT"
    - question: "Red team GITTREND with prompt injection attacks"
    - question: "Score the security posture of GITTREND"

tools:
  - tool_spec:
      type: generic
      name: discover_agents
      description: "Discover all Cortex Agents in this Snowflake account. Returns names, FQNs, roles, tools, and semantic views."
      input_schema:
        type: object
        properties: {}

  - tool_spec:
      type: generic
      name: map_attack_surface
      description: "Map the RBAC attack surface for a specific agent. Walks role grants recursively, compares against semantic view scope, identifies over-permissioned objects."
      input_schema:
        type: object
        properties:
          agent_name:
            type: string
            description: "Name of the agent to analyze"
        required:
          - agent_name

  - tool_spec:
      type: generic
      name: red_team_agent
      description: "Run automated red team attacks against an agent using 50 templates across 7 categories. Each attack is judged by an LLM."
      input_schema:
        type: object
        properties:
          agent_name:
            type: string
            description: "Name of the agent to attack"
          categories:
            type: string
            description: "Optional comma-separated filter: pii_extraction, prompt_injection, scope_violation, data_exfiltration, role_escalation, social_engineering, multi_turn"
        required:
          - agent_name

  - tool_spec:
      type: generic
      name: score_agent
      description: "Run full security evaluation and compute A-F scorecard with 5 weighted metrics. Saves results for trending."
      input_schema:
        type: object
        properties:
          agent_name:
            type: string
            description: "Name of the agent to score"
        required:
          - agent_name

  - tool_spec:
      type: generic
      name: generate_remediation
      description: "Generate REVOKE, masking policy, and row access policy SQL to fix security findings. Dry-run only with undo SQL."
      input_schema:
        type: object
        properties:
          agent_name:
            type: string
            description: "Name of the agent to remediate"
        required:
          - agent_name

  - tool_spec:
      type: generic
      name: analyze_agent_chains
      description: "Map multi-agent dependency chains and compute blast radius via BFS traversal."
      input_schema:
        type: object
        properties: {}

tool_resources:
  discover_agents:
    type: procedure
    identifier: AGENTSHIELD_DB.PUBLIC.DISCOVER_AGENTS
    execution_environment:
      type: warehouse
      warehouse: ML_MODEL_WH

  map_attack_surface:
    type: procedure
    identifier: AGENTSHIELD_DB.PUBLIC.MAP_ATTACK_SURFACE
    execution_environment:
      type: warehouse
      warehouse: ML_MODEL_WH

  red_team_agent:
    type: procedure
    identifier: AGENTSHIELD_DB.PUBLIC.RED_TEAM_AGENT
    execution_environment:
      type: warehouse
      warehouse: ML_MODEL_WH

  score_agent:
    type: procedure
    identifier: AGENTSHIELD_DB.PUBLIC.SCORE_AGENT
    execution_environment:
      type: warehouse
      warehouse: ML_MODEL_WH

  generate_remediation:
    type: procedure
    identifier: AGENTSHIELD_DB.PUBLIC.GENERATE_REMEDIATION
    execution_environment:
      type: warehouse
      warehouse: ML_MODEL_WH

  analyze_agent_chains:
    type: procedure
    identifier: AGENTSHIELD_DB.PUBLIC.ANALYZE_AGENT_CHAINS
    execution_environment:
      type: warehouse
      warehouse: ML_MODEL_WH
